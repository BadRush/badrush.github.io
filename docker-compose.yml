services:
  counter:
    image: diary-counter:latest
    container_name: diary-counter
    build:
      context: ./counter
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data:/data
    networks:
      web_net:
        ipv4_address: 10.118.2.4

  web:
    image: diary-profile:latest
    container_name: diary-profile
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - counter
    ports:
      # Opsional: di-bind ke loopback host VM untuk direct testing/debug lokal
      - "127.0.0.1:${PORT:-4601}:80"
    networks:
      web_net:
        ipv4_address: 10.118.2.2

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: diary-tunnel
    restart: unless-stopped
    command: tunnel run --token ${TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      web_net:
        ipv4_address: 10.118.2.3

networks:
  web_net:
    name: profil_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.118.2.0/28
          gateway: 10.118.2.1
