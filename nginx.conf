## ====================================================================
## SECURITY-HARDENED NGINX CONFIGURATION
## Last updated: 2026-05-31 — hardened after log analysis
## ====================================================================

# --- Rate Limiting Zone ---
# Mitigates brute-force scanning (10 req/sec burst, 5 req/sec sustained)
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sensitive:10m rate=2r/s;

# --- Default Server: Drop unknown Host headers ---
server {
    listen 80 default_server;
    server_name _;

    # Drop connections that do not match the allowed domains
    return 444;
}

# --- Main Server Block ---
server {
    listen 80;
    server_name profile.anambadrus.my.id anambadrus.my.id localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ==============================================================
    # SECURITY HEADERS
    # ==============================================================
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy — prevent leaking full URLs
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy — restrict browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://pagead2.googlesyndication.com https://adservice.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https:; frame-src https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Strict Transport Security (activate after HTTPS is confirmed working)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Prevent server version disclosure
    server_tokens off;

    # ==============================================================
    # BLOCK: .git directory (CRITICAL — was exposed as 200!)
    # ==============================================================
    location ~ /\.git {
        deny all;
        access_log off;
        return 404;
    }

    # ==============================================================
    # BLOCK: All dotfiles and dotdirectories (.env, .aws, .gitconfig, etc.)
    # ==============================================================
    location ~ /\. {
        deny all;
        access_log off;
        return 404;
    }

    # ==============================================================
    # BLOCK: Sensitive config & infrastructure files
    # Detected in logs: docker-compose.yml, composer.json, web.config,
    #   application.yml, parameters.yml, appsettings.json, etc.
    # ==============================================================
    location ~* (docker-compose\.yml|Dockerfile|composer\.(json|lock)|package(-lock)?\.json|web\.config|appsettings\.json|application\.yml|parameters\.yml|Makefile|Gruntfile|Gulpfile|Rakefile|Gemfile|yarn\.lock|\.dockerignore)$ {
        deny all;
        access_log off;
        return 404;
    }

    # ==============================================================
    # BLOCK: Credential & secret files
    # Detected in logs: *credentials.json, *secret*.json, *key*.json,
    #   firebase-*.json, service-account*.json, secrets.json
    # ==============================================================
    location ~* (credential|secret|service.account|firebase|sa-key|sa-private|keyfile|gcp-).*\.(json|yml|yaml)$ {
        deny all;
        access_log off;
        return 404;
    }

    # ==============================================================
    # BLOCK: PHP files (not a PHP site — all requests are attacks)
    # Detected in logs: phpinfo.php, config.php, info.php, test.php, etc.
    # ==============================================================
    location ~ \.php$ {
        deny all;
        access_log off;
        return 404;
    }

    # ==============================================================
    # BLOCK: Python / server-side scripts
    # Detected in logs: settings.py
    # ==============================================================
    location ~* \.(py|rb|pl|cgi|sh|bash)$ {
        deny all;
        access_log off;
        return 404;
    }

    # ==============================================================
    # BLOCK: Server-side JS config files (not static assets)
    # Detected in logs: server.js, app.js, config.js, .env.js
    # ==============================================================
    location ~* ^/(server|app|config|\.env[^/]*)\.js$ {
        deny all;
        access_log off;
        return 404;
    }

    # ==============================================================
    # BLOCK: WordPress paths (not a WP site — all requests are attacks)
    # Detected in logs: wp-includes, wp-content, wp-admin, xmlrpc.php
    # ==============================================================
    location ~* /wp-(admin|content|includes|login|json|cron) {
        deny all;
        access_log off;
        return 404;
    }

    location = /xmlrpc.php {
        deny all;
        access_log off;
        return 404;
    }

    location ~* /wp-.*\.php$ {
        deny all;
        access_log off;
        return 404;
    }

    # ==============================================================
    # BLOCK: Common CMS / admin paths
    # ==============================================================
    location ~* ^/(admin|administrator|phpmyadmin|pma|myadmin|mysql|cpanel|cgi-bin|wp-login) {
        deny all;
        access_log off;
        return 404;
    }

    # ==============================================================
    # BLOCK: Known malicious scanners via User-Agent
    # ==============================================================
    if ($http_user_agent ~* (sqlmap|nikto|nessus|dirbuster|w3af|acunetix|nmap|masscan|zgrab|gobuster|nuclei|httpx|WPScan)) {
        return 403;
    }

    # ==============================================================
    # Rate limiting on main location
    # ==============================================================
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ =404;
    }

    # ==============================================================
    # PERFORMANCE: Gzip compression
    # ==============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ==============================================================
    # PERFORMANCE: Cache static assets
    # ==============================================================
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
        # Re-add security headers (add_header in this block overrides parent)
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==============================================================
    # Custom error pages — minimal information disclosure
    # ==============================================================
    error_page 403 404 /404.html;
    location = /404.html {
        internal;
    }
}
